plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kosratdahmad.mashxall.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kosratdahmad.mashxall.nativeapp'
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName '1.0.0-native'
    }

    buildTypes {
        debug { applicationIdSuffix '' }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['db']
    }
}
