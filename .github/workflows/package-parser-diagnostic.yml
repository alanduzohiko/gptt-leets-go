name: Diagnose Android 11 package parsing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-parser-diagnostic.yml"
      - "tools/probe-package-manager.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-manager-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic script
        uses: actions/checkout@v4

      - name: Download the exact APK from repair build 43
        uses: actions/download-artifact@v4
        with:
          name: mashxall-apk-for-emulator-43
          path: dist
          repository: alanduzohiko/gptt-leets-go
          run-id: 39732327531
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the exact APK payload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Mashxall-3.1.3.apk
          sha256sum dist/Mashxall-3.1.3.apk
          unzip -t dist/Mashxall-3.1.3.apk | tail -n 2

      - name: Probe PackageManager on Android 11
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          disable-animations: false
          script: bash tools/probe-package-manager.sh

      - name: Upload exact PackageManager diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android11-package-manager-diagnostic
          path: |
            dist/package-probe-platform.txt
            dist/package-manager-install.txt
            dist/package-manager-exit-code.txt
            dist/package-manager-result.txt
            dist/package-probe-logcat.txt
            dist/package-probe-platform.txt
            dist/package-probe-services-before.txt
            dist/package-probe-services-after.txt
            dist/control-install.txt
            dist/control-install-exit-code.txt
            dist/probe-build.txt
            dist/package-service-after-control.txt
            dist/package-service-after-target.txt
            dist/package-probe-dumpsys.txt
          if-no-files-found: ignore
          retention-days: 14
