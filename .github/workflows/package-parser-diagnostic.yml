name: Diagnose Android 11 package parsing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-parser-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-manager-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the exact APK from repair build 43
        uses: actions/download-artifact@v4
        with:
          name: mashxall-apk-for-emulator-43
          path: dist
          repository: \${{ github.repository }}
          run-id: 39732327531
          github-token: \${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the exact APK payload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Mashxall-3.1.3.apk
          sha256sum dist/Mashxall-3.1.3.apk
          unzip -t dist/Mashxall-3.1.3.apk | tail -n 2

      - name: Probe PackageManager on Android 11
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set +e
            mkdir -p dist
            adb shell getprop ro.build.version.release > dist/package-probe-platform.txt 2>&1
            adb shell getprop ro.build.version.sdk >> dist/package-probe-platform.txt 2>&1
            adb install --no-streaming dist/Mashxall-3.1.3.apk > dist/package-manager-install.txt 2>&1
            rc=$?
            cat dist/package-manager-install.txt
            echo "$rc" > dist/package-manager-exit-code.txt
            if [[ "$rc" -eq 0 ]]; then
              echo "PACKAGE_MANAGER_INSTALL_SUCCEEDED" | tee dist/package-manager-result.txt
            elif grep -Eqi 'INSTALL_FAILED_NO_MATCHING_ABIS|NO_MATCHING_ABIS' dist/package-manager-install.txt; then
              echo "PACKAGE_PARSED; INSTALL_STOPPED_ONLY_BY_X86_VS_ARM64_NATIVE_ABI" | tee dist/package-manager-result.txt
            else
              echo "PACKAGE_MANAGER_REJECTED_APK; RAW_INSTALL_ERROR_FOLLOWS" | tee dist/package-manager-result.txt
            fi
            adb logcat -d -v brief -t 2500 > dist/package-probe-logcat.txt 2>&1 || true
            exit 0

      - name: Upload exact PackageManager diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android11-package-manager-diagnostic
          path: |
            dist/package-probe-platform.txt
            dist/package-manager-install.txt
            dist/package-manager-exit-code.txt
            dist/package-manager-result.txt
            dist/package-probe-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
