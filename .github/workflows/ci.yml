name: Validate Mashxall source, Android build and repair tooling

on:
  push:
    branches: ["main", "repair/**", "redesign/**"]
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-reader-first-redesign.yml"
      - "unified-app/**"
      - "IMPLEMENTATION_MATRIX_AR.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/audio-library-sources.md"
      - "docs/tajweed-text-source.md"
      - "docs/redesign-spec-ar.md"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-reader-first-redesign.yml"
      - "unified-app/**"
      - "IMPLEMENTATION_MATRIX_AR.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/audio-library-sources.md"
      - "docs/tajweed-text-source.md"
      - "docs/redesign-spec-ar.md"
  workflow_dispatch:

concurrency:
  group: mashxall-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Python for source-data extraction
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify original source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mashxall-input" dist/runtime-test
          gh release download unified-source-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "Mashxall-Unified-Source-Bundle.zip" \
            --dir "$RUNNER_TEMP/mashxall-input"
          SOURCE="$RUNNER_TEMP/mashxall-input/Mashxall-Unified-Source-Bundle.zip"
          test -s "$SOURCE"
          ACTUAL="$(sha256sum "$SOURCE" | awk '{print $1}')"
          EXPECTED="9430a52d73bfff7d897320e36173ce9d6f72f7c8d24b24dcc45b3dd4e70aba96"
          echo "Original source bundle SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "The original bundle fingerprint differs from the verified source. Stop."
            exit 1
          fi
          echo "Verified original app source bundle."

      - name: Extract original app data into Android assets
        env:
          MASHXALL_PRINT_DB_SCHEMAS: "0"
        run: |
          set -euo pipefail
          python tools/extract_unified_content.py \
            --bundle "$RUNNER_TEMP/mashxall-input/Mashxall-Unified-Source-Bundle.zip" \
            --out unified-app/app/src/main/assets \
            --catalog unified-app/app/src/main/assets/content_catalog.json

      - name: Install and audit source-linked audio catalogs
        run: |
          set -euo pipefail
          mkdir -p unified-app/app/src/main/assets
          cp unified-app/catalogs/mp3quran_reciters.json unified-app/app/src/main/assets/
          cp unified-app/catalogs/adhan_catalog.json unified-app/app/src/main/assets/
          python tools/audit_audio_catalogs.py \
            unified-app/app/src/main/assets/mp3quran_reciters.json \
            unified-app/app/src/main/assets/adhan_catalog.json

      - name: Audit recovered Noor, Khairah and Salawati coverage
        run: |
          set -euo pipefail
          python tools/audit_source_coverage.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --assets-root unified-app/app/src/main/assets \
            --out dist/runtime-test/source-coverage-audit.json
          python tools/audit_content_coverage.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --out dist/runtime-test/content-coverage-audit.json
          python tools/audit_content_wiring.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --source-root unified-app/app/src/main/java/com/mashxall/unified \
            --out dist/runtime-test/content-wiring-audit.json
          python tools/audit_prayer_data.py \
            --salawati unified-app/app/src/main/assets/content/salawati_3.1.3/base/assets/database/muslim_db_v2.5.1.db \
            --out dist/runtime-test/prayer-data-audit.json

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Kotlin tests, lint and debug APK build
        run: gradle --no-daemon --project-dir unified-app testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="unified-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          SIGNING_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SIGNING_CERT_SHA256="ebade279706bd1b74e7d821e8ff955058b8aa56b10955e49e79ffccbe60def06"
          if [[ "$SIGNING_CERT_SHA256" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo "Unexpected APK signer. Refusing to use an ephemeral/different debug key."
            echo "Expected: $EXPECTED_SIGNING_CERT_SHA256"
            echo "Actual: $SIGNING_CERT_SHA256"
            exit 1
          fi
          echo "Stable Mashxall preview signer verified: $SIGNING_CERT_SHA256"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Mashxall-Redesign-debug.apk

      - name: Upload build-verified APK and source-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-android-build-${{ github.run_number }}
          path: |
            Mashxall-Redesign-debug.apk
            apk-sha256.txt
            unified-app/app/src/main/assets/content_catalog.json
            dist/runtime-test/
          if-no-files-found: warn
          retention-days: 14

  # Add [android11-smoke] to a push commit to run the same APK on Android 11.
  android-11-runtime-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android11-smoke]')
    needs: android-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_PATH: ${{ runner.temp }}/mashxall-build-artifact/Mashxall-Redesign-debug.apk
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download APK built by this workflow run
        uses: actions/download-artifact@v4
        with:
          name: mashxall-android-build-${{ github.run_number }}
          path: ${{ runner.temp }}/mashxall-build-artifact

      - name: Verify the downloaded APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          mkdir -p dist/runtime-test
          sha256sum "$APK_PATH" | tee dist-apk-sha256.txt

      - name: Prepare Android 11 emulator
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-30;default;x86_64"

      - name: Install and exercise APK on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -memory 3072 -cores 2
          script: bash tools/runtime-smoke-android11.sh

      - name: Upload Android 11 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-android11-smoke-${{ github.run_number }}
          path: |
            dist/runtime-test/
            dist-apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
