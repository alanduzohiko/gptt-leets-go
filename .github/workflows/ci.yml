name: Validate repair tooling

on:
  push:
    branches: ["main", "repair/**"]
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
