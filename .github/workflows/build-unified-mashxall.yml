name: Build the new unified Mashxall Android app

concurrency:
  group: mashxall-android-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  push:
    branches: ["main"]
    paths:
      - "unified-app/**"
      - "tools/extract_unified_content.py"
      - "tools/reverse_engineer_sources.py"
      - "tools/audit_content_wiring.py"
      - "tests/test_audit_content_wiring.py"
      - "tools/reverse_engineer_hadith_decoder.py"
      - "tools/audit_hadith_decoder.py"
      - "tools/audit_prayer_data.py"
      - "tools/audit_apk_assets.py"
      - "tests/test_audit_apk_assets.py"
      - "tools/runtime-smoke-android11.sh"
      - ".github/workflows/runtime-smoke-unified-android.yml"
      - ".github/workflows/build-unified-mashxall.yml"
  workflow_dispatch:
    inputs:
      source_asset_name:
        description: "Source bundle asset in the release"
        required: true
        default: "Mashxall-Unified-Source-Bundle.zip"
      run_static_reverse_engineering:
        description: "Run the slow JADX source-analysis pass"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-unified-app:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.tag_name == 'unified-source-v1') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only this isolated workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the original input bundle was uploaded to the correct release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'unified-source-v1' }}
          ASSET_NAME: ${{ inputs.source_asset_name || 'Mashxall-Unified-Source-Bundle.zip' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mashxall-input"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/mashxall-input"
          SOURCE="$RUNNER_TEMP/mashxall-input/$ASSET_NAME"
          if [[ ! -f "$SOURCE" ]]; then
            echo "Missing required source asset: $ASSET_NAME"
            exit 1
          fi
          ACTUAL="$(sha256sum "$SOURCE" | awk '{print $1}')"
          EXPECTED="9430a52d73bfff7d897320e36173ce9d6f72f7c8d24b24dcc45b3dd4e70aba96"
          echo "Uploaded source bundle SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Source bundle fingerprint differs from the package prepared from the supplied files. Build stopped."
            exit 1
          fi
          echo "MASHXALL_SOURCE_BUNDLE=$SOURCE" >> "$GITHUB_ENV"

      - name: Test APK asset packaging auditor
        run: python -m unittest discover -s tests -p 'test_audit_apk_assets.py'

      - name: Download JADX static analyzer
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          url="$(printf '%s' "$meta" | jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+[.]zip$")) | .browser_download_url' | head -n 1)"
          if [[ -z "$url" || "$url" == "null" ]]; then
            echo "Could not locate the official JADX release ZIP."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/jadx"
          if ! curl -fL --retry 3 --retry-all-errors --retry-delay 2 "$url" -o "$RUNNER_TEMP/jadx.zip"; then
            echo "Latest JADX asset URL failed; retrying the previously verified 1.5.6 release."
            rm -f "$RUNNER_TEMP/jadx.zip"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
              "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
              -o "$RUNNER_TEMP/jadx.zip"
          fi
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          JADX_BIN="$(find "$RUNNER_TEMP/jadx" -type f -path '*/bin/jadx' | head -n 1)"
          if [[ -z "$JADX_BIN" ]]; then
            echo "JADX executable was not found after extraction."
            exit 1
          fi
          chmod +x "$JADX_BIN"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"
          "$JADX_BIN" --version

      - name: Focused Noor Hadith decoder analysis
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[RE-FOCUSED]')
        env:
          MASHXALL_RE_DUMP_FOCUSED: "1"
        run: |
          set -euo pipefail
          python tools/reverse_engineer_hadith_decoder.py \
            --bundle "$MASHXALL_SOURCE_BUNDLE" \
            --jadx "$JADX_BIN" \
            --out "$GITHUB_WORKSPACE/dist/focused-hadith-decoder.json" \
            --timeout-per-class 180

      - name: Reverse engineer original apps for data-format clues
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_static_reverse_engineering) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[RE-ANALYSIS]'))
        env:
          MASHXALL_RE_DUMP_FOCUSED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/reverse_engineer_sources.py \
            --bundle "$MASHXALL_SOURCE_BUNDLE" \
            --jadx "$JADX_BIN" \
            --out "$GITHUB_WORKSPACE/dist/reverse-engineering-report.json" \
            --timeout-per-app 1200

      - name: Extract all source content and validate every SQLite database
        env:
          MASHXALL_PRINT_DB_SCHEMAS: "1"
        run: |
          set -euo pipefail
          python tools/extract_unified_content.py \
            --bundle "$MASHXALL_SOURCE_BUNDLE" \
            --out unified-app/app/src/main/assets \
            --catalog unified-app/app/src/main/assets/content_catalog.json

      - name: Verify Noor's real encrypted Hadith rows decrypt using the recovered AES key
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_hadith_decoder.py \
            --database unified-app/app/src/main/assets/content/noor_tafsir_1.2.2/base/assets/db_hadith_of_ayah.db \
            --out dist/hadith-decoder-audit.json

      - name: Audit that every referenced content asset exists
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_content_wiring.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --source-root unified-app/app/src/main/java/com/mashxall/unified \
            --out dist/content-wiring-audit.json

      - name: Audit content coverage from Qur'an through prayer, books and worship data
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_content_coverage.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --out dist/content-coverage-audit.json

      - name: Audit prayer database coordinates, schedules and dependent-city links
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_prayer_data.py \
            --noor unified-app/app/src/main/assets/content/noor_tafsir_1.2.2/base/assets/prayertimes.db \
            --salawati unified-app/app/src/main/assets/content/salawati_3.1.3/base/assets/database/muslim_db_v2.5.1.db \
            --out dist/prayer-data-audit.json

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build, test and lint the new app
        env:
          GRADLE_OPTS: "-Xmx5g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir unified-app clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK integrity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK="unified-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK"
          mkdir -p dist
          python tools/audit_apk_assets.py \
            --apk "$APK" \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --out dist/apk-asset-audit.json
          cp "$APK" dist/Mashxall-Unified-debug.apk
          cp unified-app/app/src/main/assets/content_catalog.json dist/content-catalog.json
          cat > dist/BUILD-STATUS-AR.txt <<'EOF'
          مەشخەڵ — تطبيق أندرويد أصلي بثلاث لغات
          ==========================================
          
          تحتوي الحزمة على محتوى نور وخيرة وصلواتي بعد التحقق من بصمات APK الأصلية وسلامة SQLite.
          فحص المحتوى يؤكد الحد الأدنى من الآيات والأحاديث والتفاسير وتحليل الكلمات وكتب PDF والمواقع والأذكار حسب التقرير المرفق.
          اجتاز البناء واختبارات الوحدة وفحص lint والتوقيع، لكن لم يُختبر التشغيل الفعلي بعد على هاتف realme X2 Pro / Android 11.
          التنبيهات والأذان تحتاج أذونات المستخدم وإعدادات Android الملائمة.
          يجب إجراء اختبار فعلي على الجهاز قبل اعتبار الإصدار نهائيًا أو نشره.
          EOF

      - name: Upload APK, extracted content catalog and verification report
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-unified-android11-build-${{ github.run_number }}
          path: |
            dist/Mashxall-Unified-debug.apk
            dist/content-catalog.json
            dist/content-wiring-audit.json
            dist/content-coverage-audit.json
            dist/hadith-decoder-audit.json
            dist/prayer-data-audit.json
            dist/apk-asset-audit.json
            dist/BUILD-STATUS-AR.txt
            dist/reverse-engineering-report.json
          if-no-files-found: warn
          retention-days: 14
