name: Build the new unified Mashxall Android app

concurrency:
  group: mashxall-android-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  push:
    branches: ["main", "redesign/**"]
    paths:
      - "unified-app/**"
      - "tools/extract_unified_content.py"
      - "tools/reverse_engineer_sources.py"
      - "tools/audit_content_wiring.py"
      - "tests/test_audit_content_wiring.py"
      - "tools/reverse_engineer_hadith_decoder.py"
      - "tools/audit_hadith_decoder.py"
      - "tools/audit_prayer_data.py"
      - "tools/audit_apk_assets.py"
      - "tests/test_audit_apk_assets.py"
      - "tools/runtime-smoke-android11.sh"
      - "tools/runtime-upgrade-smoke-android11.sh"
      - "tests/test_muezzin_catalog.py"
      - "tests/test_everyayah_reciters.py"
      - ".github/workflows/runtime-smoke-unified-android.yml"
      - ".github/workflows/build-unified-mashxall.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "unified-app/app/src/main/res/values/themes.xml"
  workflow_dispatch:
    inputs:
      source_asset_name:
        description: "Source bundle asset in the release"
        required: true
        default: "Mashxall-Unified-Source-Bundle.zip"
      run_static_reverse_engineering:
        description: "Run the slow JADX source-analysis pass"
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

jobs:
  build-unified-app:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.tag_name == 'unified-source-v1') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/redesign/'))) || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only this isolated workspace
        uses: actions/checkout@v4

      - name: Prepare the supplied Mashxall intro animation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT="unified-app/app/src/main/res/raw/mashxall_intro.mp4"
          mkdir -p "$(dirname "$OUTPUT")"
          EXPECTED_OUTPUT_SHA="847849e9bc36887d8516ee0113d3ddcc50ddc71d91ae55c5716603e0c81dfd0d"

          # Reuse the exact intro already embedded in the most recent successful
          # build. This keeps ordinary code fixes independent of the external
          # Dropbox URL while preserving the video bit-for-bit.
          PREVIOUS_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-unified-mashxall.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          PREVIOUS_RUN_NUMBER="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-unified-mashxall.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 1 --json number --jq '.[0].number // ""')"
          REUSED_INTRO=false
          if [[ -n "$PREVIOUS_RUN_ID" && -n "$PREVIOUS_RUN_NUMBER" ]]; then
            PREVIOUS_DIR="$RUNNER_TEMP/mashxall-previous-build"
            mkdir -p "$PREVIOUS_DIR"
            if gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "mashxall-unified-android11-apk-$PREVIOUS_RUN_NUMBER" --dir "$PREVIOUS_DIR"; then
              PREVIOUS_APK="$PREVIOUS_DIR/Mashxall-Unified-debug.apk"
              if [[ -s "$PREVIOUS_APK" ]]; then
                unzip -p "$PREVIOUS_APK" res/raw/mashxall_intro.mp4 > "$OUTPUT" || true
                ACTUAL_OUTPUT_SHA="$(sha256sum "$OUTPUT" | awk '{print $1}')"
                if [[ "$ACTUAL_OUTPUT_SHA" == "$EXPECTED_OUTPUT_SHA" ]]; then
                  REUSED_INTRO=true
                  echo "Reused the previously verified intro from successful build $PREVIOUS_RUN_NUMBER."
                fi
              fi
            fi
          fi

          # First build on a new branch can fall back to the supplied original video.
          if [[ "$REUSED_INTRO" != true ]]; then
            SOURCE="$RUNNER_TEMP/mashxall-intro-original.mp4"
            SOURCE_URL="https://www.dropbox.com/scl/fi/uh8uv0d6k1cfmvn640nci/VID_-1.mp4?rlkey=8fphd3qq18wv80aq80gf8hhnj&dl=1"
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 240 "$SOURCE_URL" -o "$SOURCE"
            ACTUAL_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
            EXPECTED_SHA="6332623d1d7e82d3d9e982c1b2081fd78c40b23a20d5ff9a3e4aafa503b3d3d5"
            if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
              echo "The downloaded intro is not the exact video supplied for Mashxall."
              exit 1
            fi
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            ffmpeg -hide_banner -loglevel error -y -i "$SOURCE" \
              -map 0:v:0 -an \
              -vf "scale=720:1280:flags=lanczos,fps=24,format=yuv420p" \
              -c:v libx264 -preset slow -crf 18 -profile:v baseline -level:v 3.1 \
              -x264-params "cabac=0:bframes=0:ref=1:keyint=48:min-keyint=24:scenecut=0" \
              -movflags +faststart -pix_fmt yuv420p "$OUTPUT"
          fi

          FINAL_SHA="$(sha256sum "$OUTPUT" | awk '{print $1}')"
          if [[ "$FINAL_SHA" != "$EXPECTED_OUTPUT_SHA" ]]; then
            echo "The packaged Mashxall intro does not match the previously verified video."
            exit 1
          fi
          echo "Verified reusable offline intro SHA-256: $FINAL_SHA"
          echo "Optimized offline intro size: $(du -h "$OUTPUT" | cut -f1)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the original input bundle was uploaded to the correct release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'unified-source-v1' }}
          ASSET_NAME: ${{ inputs.source_asset_name || 'Mashxall-Unified-Source-Bundle.zip' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mashxall-input"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/mashxall-input"
          SOURCE="$RUNNER_TEMP/mashxall-input/$ASSET_NAME"
          if [[ ! -f "$SOURCE" ]]; then
            echo "Missing required source asset: $ASSET_NAME"
            exit 1
          fi
          ACTUAL="$(sha256sum "$SOURCE" | awk '{print $1}')"
          EXPECTED="9430a52d73bfff7d897320e36173ce9d6f72f7c8d24b24dcc45b3dd4e70aba96"
          echo "Uploaded source bundle SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Source bundle fingerprint differs from the package prepared from the supplied files. Build stopped."
            exit 1
          fi
          echo "MASHXALL_SOURCE_BUNDLE=$SOURCE" >> "$GITHUB_ENV"

      - name: Test APK asset packaging auditor
        run: python -m unittest discover -s tests -p 'test_audit_apk_assets.py'

      - name: Test source-linked Adhan and verse-by-verse reciter catalogues
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_muezzin_catalog.py'
          python -m unittest discover -s tests -p 'test_everyayah_reciters.py'
          python tools/audit_audio_catalogs.py \
            unified-app/catalogs/mp3quran_reciters.json \
            unified-app/catalogs/adhan_catalog.json

      - name: Download JADX static analyzer
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_static_reverse_engineering) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[RE-FOCUSED]') || contains(github.event.head_commit.message, '[RE-ANALYSIS]')))
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          url="$(printf '%s' "$meta" | jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+[.]zip$")) | .browser_download_url' | head -n 1)"
          if [[ -z "$url" || "$url" == "null" ]]; then
            echo "Could not locate the official JADX release ZIP."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/jadx"
          if ! curl -fL --retry 3 --retry-all-errors --retry-delay 2 "$url" -o "$RUNNER_TEMP/jadx.zip"; then
            echo "Latest JADX asset URL failed; retrying the previously verified 1.5.6 release."
            rm -f "$RUNNER_TEMP/jadx.zip"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
              "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
              -o "$RUNNER_TEMP/jadx.zip"
          fi
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          JADX_BIN="$(find "$RUNNER_TEMP/jadx" -type f -path '*/bin/jadx' | head -n 1)"
          if [[ -z "$JADX_BIN" ]]; then
            echo "JADX executable was not found after extraction."
            exit 1
          fi
          chmod +x "$JADX_BIN"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"
          "$JADX_BIN" --version

      - name: Focused Noor Hadith decoder analysis
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[RE-FOCUSED]')
        env:
          MASHXALL_RE_DUMP_FOCUSED: "1"
        run: |
          set -euo pipefail
          python tools/reverse_engineer_hadith_decoder.py \
            --bundle "$MASHXALL_SOURCE_BUNDLE" \
            --jadx "$JADX_BIN" \
            --out "$GITHUB_WORKSPACE/dist/focused-hadith-decoder.json" \
            --timeout-per-class 180

      - name: Reverse engineer original apps for data-format clues
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_static_reverse_engineering) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[RE-ANALYSIS]'))
        env:
          MASHXALL_RE_DUMP_FOCUSED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/reverse_engineer_sources.py \
            --bundle "$MASHXALL_SOURCE_BUNDLE" \
            --jadx "$JADX_BIN" \
            --out "$GITHUB_WORKSPACE/dist/reverse-engineering-report.json" \
            --timeout-per-app 1200

      - name: Extract all source content and validate every SQLite database
        env:
          MASHXALL_PRINT_DB_SCHEMAS: "1"
        run: |
          set -euo pipefail
          python tools/extract_unified_content.py \
            --bundle "$MASHXALL_SOURCE_BUNDLE" \
            --out unified-app/app/src/main/assets \
            --catalog unified-app/app/src/main/assets/content_catalog.json

      - name: Verify Noor's real encrypted Hadith rows decrypt using the recovered AES key
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_hadith_decoder.py \
            --database unified-app/app/src/main/assets/content/noor_tafsir_1.2.2/base/assets/db_hadith_of_ayah.db \
            --out dist/hadith-decoder-audit.json

      - name: Audit that every referenced content asset exists
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_content_wiring.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --source-root unified-app/app/src/main/java/com/mashxall/unified \
            --out dist/content-wiring-audit.json

      - name: Audit content coverage from Qur'an through prayer, books and worship data
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_content_coverage.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --out dist/content-coverage-audit.json

      - name: Audit prayer database coordinates, schedules and dependent-city links
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/audit_prayer_data.py \
            --salawati unified-app/app/src/main/assets/content/salawati_3.1.3/base/assets/database/muslim_db_v2.5.1.db \
            --out dist/prayer-data-audit.json

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up JDK 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build, test and lint the new app
        env:
          GRADLE_OPTS: "-Xmx5g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir unified-app clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK integrity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK="unified-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK"
          mkdir -p dist
          python tools/audit_apk_assets.py \
            --apk "$APK" \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --out dist/apk-asset-audit.json
          cp "$APK" dist/Mashxall-Unified-debug.apk
          cp unified-app/app/src/main/assets/content_catalog.json dist/content-catalog.json
          cat > dist/BUILD-STATUS-AR.txt <<'EOF'
          مەشخەڵ — تطبيق أندرويد أصلي بثلاث لغات
          ==========================================
          
          تحتوي الحزمة على محتوى نور وخيرة وصلواتي بعد التحقق من بصمات APK الأصلية وسلامة SQLite.
          فحص المحتوى يؤكد الحد الأدنى من الآيات والأحاديث والتفاسير وتحليل الكلمات وكتب PDF والمواقع والأذكار حسب التقرير المرفق.
          اجتاز البناء واختبارات الوحدة وفحص lint والتوقيع، لكن لم يُختبر التشغيل الفعلي بعد على هاتف realme X2 Pro / Android 11.
          التنبيهات والأذان تحتاج أذونات المستخدم وإعدادات Android الملائمة.
          يجب إجراء اختبار فعلي على الجهاز قبل اعتبار الإصدار نهائيًا أو نشره.
          EOF

      - name: Download known-good Build 515 for an in-place upgrade test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-device-smoke]')
        uses: actions/download-artifact@v4
        with:
          name: mashxall-unified-android11-apk-515
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42675292425
          path: dist/runtime-test/baseline

      - name: Resolve APK paths for the Android 11 upgrade test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-device-smoke]')
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/unified-app/app/build/outputs/apk/debug/app-debug.apk"
          BASELINE_APK="$GITHUB_WORKSPACE/dist/runtime-test/baseline/Mashxall-Unified-debug.apk"
          test -s "$APK"
          test -s "$BASELINE_APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "BASELINE_APK_PATH=$BASELINE_APK" >> "$GITHUB_ENV"
          sha256sum "$APK" "$BASELINE_APK" | tee dist/runtime-test/apk-hashes.txt

      # Device-side verification is opt-in for this build. A [skip-runtime]
      # commit intentionally publishes the signed APK for the user to test on a
      # physical Android 11 phone instead of starting the hosted emulator.
      - name: Verify Build 515 upgrade and app screens on Android 11
        id: android11-upgrade-smoke
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-device-smoke]')
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -memory 3072 -cores 2
          script: bash tools/runtime-upgrade-smoke-android11.sh

      - name: Upload Android 11 upgrade diagnostics
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[run-device-smoke]')
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-android11-upgrade-diagnostics-${{ github.run_number }}
          path: |
            dist/runtime-test/**
            !dist/runtime-test/baseline/**
          if-no-files-found: warn
          retention-days: 14

      - name: Require Android 11 upgrade and runtime checks to pass
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-device-smoke]') && steps.android11-upgrade-smoke.outcome != 'success'
        run: |
          echo "Android 11 Build 515 in-place upgrade/runtime test failed; refusing to publish this APK."
          exit 1

      - name: Upload a clean APK-only package for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-unified-android11-apk-${{ github.run_number }}
          path: dist/Mashxall-Unified-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload APK, extracted content catalog and verification report
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-unified-android11-build-${{ github.run_number }}
          path: |
            dist/Mashxall-Unified-debug.apk
            dist/content-catalog.json
            dist/content-wiring-audit.json
            dist/content-coverage-audit.json
            dist/hadith-decoder-audit.json
            dist/prayer-data-audit.json
            dist/apk-asset-audit.json
            dist/BUILD-STATUS-AR.txt
            dist/reverse-engineering-report.json
          if-no-files-found: warn
          retention-days: 14
