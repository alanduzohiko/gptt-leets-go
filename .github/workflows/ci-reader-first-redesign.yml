name: Validate reader-first Mashxall redesign

on:
  push:
    branches:
      - "redesign/**"
    paths:
      - "unified-app/**"
      - "docs/redesign-spec-ar.md"
      - "tools/runtime-smoke-android11.sh"
      - ".github/workflows/ci-reader-first-redesign.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "unified-app/**"
      - "docs/redesign-spec-ar.md"
      - "tools/runtime-smoke-android11.sh"
      - ".github/workflows/ci-reader-first-redesign.yml"
  workflow_dispatch:

concurrency:
  group: reader-first-redesign-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout redesign source
        uses: actions/checkout@v4

      - name: Set up Python for source-data extraction
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify the original source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mashxall-input" dist/runtime-test
          gh release download unified-source-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "Mashxall-Unified-Source-Bundle.zip" \
            --dir "$RUNNER_TEMP/mashxall-input"
          SOURCE="$RUNNER_TEMP/mashxall-input/Mashxall-Unified-Source-Bundle.zip"
          test -s "$SOURCE"
          ACTUAL="$(sha256sum "$SOURCE" | awk '{print $1}')"
          EXPECTED="9430a52d73bfff7d897320e36173ce9d6f72f7c8d24b24dcc45b3dd4e70aba96"
          echo "Original source bundle SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "The original bundle fingerprint differs from the verified source. Stop."
            exit 1
          fi
          echo "Verified original app source bundle."

      - name: Extract original app data into the debug APK
        env:
          MASHXALL_PRINT_DB_SCHEMAS: "1"
        run: |
          set -euo pipefail
          python tools/extract_unified_content.py \
            --bundle "$RUNNER_TEMP/mashxall-input/Mashxall-Unified-Source-Bundle.zip" \
            --out unified-app/app/src/main/assets \
            --catalog unified-app/app/src/main/assets/content_catalog.json

      - name: Audit all three original app libraries and required feature assets
        run: |
          set -euo pipefail
          python tools/audit_source_coverage.py \
            --catalog unified-app/app/src/main/assets/content_catalog.json \
            --out dist/runtime-test/source-coverage-audit.json

      - name: Audit actual Noor and Salawati prayer sources
        run: |
          set -euo pipefail
          python tools/audit_prayer_data.py \
            --noor unified-app/app/src/main/assets/content/noor_tafsir_1.2.2/base/assets/prayertimes.db \
            --salawati unified-app/app/src/main/assets/content/salawati_3.1.3/base/assets/database/muslim_db_v2.5.1.db \
            --out dist/runtime-test/prayer-data-audit.json

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-30 platforms;android-35 build-tools;35.0.0 emulator system-images;android-30;default;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate Android 11 runtime test script syntax
        run: bash -n tools/runtime-smoke-android11.sh

      - name: Run unit tests, lint, and a debug APK build
        run: gradle --no-daemon --project-dir unified-app testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="unified-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -n 2
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Mashxall-Redesign-debug.apk

      - name: Install and exercise redesigned screens on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -memory 3072 -cores 2
          script: APK_PATH="unified-app/app/build/outputs/apk/debug/app-debug.apk" bash tools/runtime-smoke-android11.sh

      - name: Upload APK and Android 11 runtime results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-reader-first-redesign-${{ github.run_number }}
          path: |
            Mashxall-Redesign-debug.apk
            apk-sha256.txt
            unified-app/app/src/main/assets/content_catalog.json
            dist/runtime-test/
          if-no-files-found: warn
          retention-days: 14
