name: Rebuild safe Mashxall split set

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-from-release.yml"
      - "tools/prepare_split_set.py"
      - "tools/verify_install_set.py"
      - "tools/verify_universal_apk.py"
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: "GitHub Release tag holding the original .apks file"
        required: true
        default: "source-3.1.3"
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.tag_name == 'source-3.1.3') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4

      - name: Cancel superseded rebuild/test runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          old_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rebuild-from-release.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.run_number < $CURRENT_RUN_NUMBER and (.status == \"queued\" or .status == \"in_progress\")) | .id")"
          if [[ -z "$old_runs" ]]; then
            echo "No older rebuild runs need cancellation."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "Canceling superseded rebuild/test workflow run $run_id"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done <<< "$old_runs"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the obsolete SDK package "tools", which now fails to install.
          # Install only the required modern build-tools and platform in the following step.
          packages: ""

      - name: Install official Android build tools
        run: sdkmanager --install "build-tools;35.0.0" "platforms;android-35"

      - name: Download exact original split bundle from this repository's Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_release_tag || github.event.release.tag_name || 'source-3.1.3' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apks" --dir source
          mapfile -t files < <(find source -maxdepth 1 -type f -name '*.apks' -print)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected exactly one .apks asset in release $SOURCE_TAG; found ${#files[@]}."
            exit 1
          fi
          source_file="${files[0]}"
          actual="$(sha256sum "$source_file" | awk '{print $1}')"
          expected="bba56d408b552e31be43071af6a02dcdd66608b594b1fa10ca1a63fb51a504e3"
          echo "Source file: $source_file"
          echo "Source SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "The downloaded asset does not match the exact bundle supplied in the conversation."
            exit 1
          fi
          echo "SOURCE_APKS=$source_file" >> "$GITHUB_ENV"

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/tags/v2.11.1)"
          url="$(printf '%s' "$meta" | jq -r '.assets[] | select(.name == "apktool_2.11.1.jar") | .browser_download_url' | head -n 1)"
          if [[ -z "$url" || "$url" == "null" ]]; then
            echo "Could not locate the official Apktool JAR in the latest release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apktool"
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/apktool/apktool.jar"
          echo "APKTOOL_JAR=$RUNNER_TEMP/apktool/apktool.jar" >> "$GITHUB_ENV"
          version="$(java -jar "$RUNNER_TEMP/apktool/apktool.jar" --version)"
          echo "Pinned Apktool version: $version"
          if [[ "$version" != "2.11.1" ]]; then
            echo "Expected Apktool 2.11.1; refusing a tool-version drift."
            exit 1
          fi

      - name: Download pinned APKEditor split merger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apkeditor"
          url="https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/apkeditor/APKEditor.jar"
          actual="$(sha256sum "$RUNNER_TEMP/apkeditor/APKEditor.jar" | awk '{print $1}')"
          expected="a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67"
          if [[ "$actual" != "$expected" ]]; then
            echo "APKEditor checksum mismatch; refusing to continue."
            exit 1
          fi
          echo "APKEditor artifact SHA-256 verified."
          echo "APKEDITOR_JAR=$RUNNER_TEMP/apkeditor/APKEditor.jar" >> "$GITHUB_ENV"
      - name: Prepare Mashxall identity while preserving original DEX code
        run: |
          set -euo pipefail
          python tools/prepare_split_set.py \
            --input "$SOURCE_APKS" \
            --apktool-jar "$APKTOOL_JAR" \
            --workdir "$GITHUB_WORKSPACE/work/prepared" \
            --report "$GITHUB_WORKSPACE/work/prepared/prepare-report.json"

      - name: Align and sign all APK parts with official Android SDK tools
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$GITHUB_WORKSPACE/work/prepared/unsigned-splits"
          SIGNED="$GITHUB_WORKSPACE/dist/signed-parts"
          ALIGNED="$RUNNER_TEMP/aligned"
          mkdir -p "$SIGNED" "$ALIGNED"

          KEYSTORE="$RUNNER_TEMP/mashxall-signing.jks"
          ALIAS="${SIGNING_KEY_ALIAS:-mashxall}"
          if [[ -n "${SIGNING_KEY_BASE64:-}" ]]; then
            if [[ -z "${SIGNING_STORE_PASSWORD:-}" ]]; then
              echo "SIGNING_STORE_PASSWORD is required when SIGNING_KEY_BASE64 is configured."
              exit 1
            fi
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
            KS_PASS="$SIGNING_STORE_PASSWORD"
            KEY_PASS="${SIGNING_KEY_PASSWORD:-$KS_PASS}"
            echo "Using repository-provided signing key."
          else
            KS_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mashxall, OU=Android, O=Personal Project, C=IQ"
            echo "::warning::No stable signing-key secret is configured. This build gets a temporary key; a later rebuild will require uninstalling this test build unless the same key is configured as repository Actions secrets."
          fi

          for input in "$UNSIGNED"/*.apk; do
            base="$(basename "$input")"
            aligned="$ALIGNED/$base"
            output="$SIGNED/${base%.apk}.apk"
            "$BT/zipalign" -P 16 -f 4 "$input" "$aligned"
            "$BT/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true \
              --v3-signing-enabled true --v4-signing-enabled false \
              --out "$output" "$aligned"
            "$BT/apksigner" verify --verbose --print-certs "$output"
            "$BT/zipalign" -c -P 16 -v 4 "$output"
          done

          cert=""
          for apk in "$SIGNED"/*.apk; do
            fingerprint="$("$BT/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' | head -n 1 | tr -d '[:space:]')"
            if [[ -z "$fingerprint" ]]; then
              echo "Could not read signer certificate fingerprint from $apk"
              exit 1
            fi
            if [[ -z "$cert" ]]; then cert="$fingerprint"; fi
            if [[ "$fingerprint" != "$cert" ]]; then
              echo "Split signing certificate mismatch in $apk"
              exit 1
            fi
          done
          echo "Signer certificate SHA-256: $cert"

          # Merge all prepared split parts into one standalone APK, then sign that APK.
          UNIVERSAL_UNSIGNED="$GITHUB_WORKSPACE/dist/Mashxall-3.1.3-universal-unsigned.apk"
          UNIVERSAL_ALIGNED="$ALIGNED/Mashxall-3.1.3-universal-aligned.apk"
          UNIVERSAL_SIGNED="$GITHUB_WORKSPACE/dist/Mashxall-3.1.3.apk"
          java -jar "$APKEDITOR_JAR" m -i "$UNSIGNED" -o "$UNIVERSAL_UNSIGNED" -f
          test -s "$UNIVERSAL_UNSIGNED"
          "$BT/zipalign" -P 16 -f 4 "$UNIVERSAL_UNSIGNED" "$UNIVERSAL_ALIGNED"
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "$UNIVERSAL_SIGNED" "$UNIVERSAL_ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$UNIVERSAL_SIGNED"
          "$BT/zipalign" -c -P 16 -v 4 "$UNIVERSAL_SIGNED"
          python tools/verify_universal_apk.py \
            --source "$SOURCE_APKS" \
            --output "$UNIVERSAL_SIGNED" \
            --report "$GITHUB_WORKSPACE/dist/universal-verification.json"


      - name: Validate Android-readable manifest of the standalone APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dist/Mashxall-3.1.3.apk"
          ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          test -x "$ANALYZER"
          "$ANALYZER" manifest print "$APK" | tee dist/standalone-manifest.xml
          if grep -Eq 'android:isSplitRequired="true"|[[:space:]]split="' dist/standalone-manifest.xml; then
            echo "ERROR: merged APK manifest still declares split-only installation requirements."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/aapt-badging.txt
          grep -q "^package: name='com.kosratdahmad.mashxall.full'" dist/aapt-badging.txt
          grep -q "^application: label='مەشخەڵ' icon='res/mipmap-anydpi-v26/ic_launcher.xml'" dist/aapt-badging.txt
          grep -q "^sdkVersion:" dist/aapt-badging.txt

      - name: Package set and verify preservation
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd dist/signed-parts && zip -X -9 ../Mashxall-3.1.3-rebranded.apks \
            base.apk split_config.arm64_v8a.apk split_config.xxhdpi.apk)
          (cd dist/signed-parts && zip -X -9 ../Mashxall-3.1.3-signed-parts.zip \
            base.apk split_config.arm64_v8a.apk split_config.xxhdpi.apk)
          cp "$GITHUB_WORKSPACE/work/prepared/prepare-report.json" dist/prepare-report.json
          python tools/verify_install_set.py \
            --source "$SOURCE_APKS" \
            --output "$GITHUB_WORKSPACE/dist/Mashxall-3.1.3-rebranded.apks" \
            --unsigned-dir "$GITHUB_WORKSPACE/work/prepared/unsigned-splits" \
            --prepare-report "$GITHUB_WORKSPACE/work/prepared/prepare-report.json" \
            --report "$GITHUB_WORKSPACE/dist/final-verification.json"
          cat > dist/INSTALL-AR.txt <<'EOF'
          مەشخەڵ / Mashxall — معلومات التثبيت
          ======================================

          هذه حزمة من ثلاثة ملفات APK، وليست ملف APK واحدًا. يجب تثبيت الأجزاء الثلاثة معًا.

          1. نزّل Mashxall-3.1.3-signed-parts.zip واستخرجه.
          2. افتح SAI (Split APKs Installer)، ثم اختر Install APKs.
          3. حدّد الملفات الثلاثة معًا: base.apk و split_config.arm64_v8a.apk و split_config.xxhdpi.apk.
          4. وافق على التثبيت.

          معرّف هذه النسخة هو com.kosratdahmad.mashxall.full، وهو منفصل عن النسخة الرسمية com.kosratdahmad.myprayers؛ لذلك لا حاجة لحذف التطبيق الأصلي لاختبارها.

          هذا الملف مخصّص للاختبار. لا تعتبر البناء ناجحًا حتى يجتاز اختبار التثبيت والإقلاع على محاكي Android 11 بمعمارية ARM64.
          EOF

      - name: Upload standalone APK for ARM64 emulator verification
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-apk-for-emulator-${{ github.run_number }}
          path: dist/Mashxall-3.1.3.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload build and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-android11-repair-${{ github.run_number }}
          path: |
            dist/Mashxall-3.1.3.apk
            dist/universal-verification.json
            dist/standalone-manifest.xml
            dist/aapt-badging.txt
            dist/Mashxall-3.1.3-rebranded.apks
            dist/Mashxall-3.1.3-signed-parts.zip
            dist/signed-parts/*.apk
            dist/prepare-report.json
            dist/final-verification.json
            dist/INSTALL-AR.txt
          if-no-files-found: error
          retention-days: 14

  emulator-test:
    needs: rebuild
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4

      - name: Download the exact APK built by this workflow
        uses: actions/download-artifact@v4
        with:
          name: mashxall-apk-for-emulator-${{ github.run_number }}
          path: dist

      - name: Install and launch on Android 11 ARM64 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          # Hosted macOS ARM runners may reject HVF nested acceleration; force software emulation.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -accel off
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash tools/test-emulator.sh

      - name: Upload ARM64 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-11-arm64-diagnostics-${{ github.run_number }}
          path: |
            dist/emulator-test.txt
            dist/emulator-logcat.txt
            dist/emulator-activities.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [rebuild, emulator-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the statically validated APK
        uses: actions/download-artifact@v4
        with:
          name: mashxall-apk-for-emulator-${{ github.run_number }}
          path: dist

      - name: Publish with an honest runtime-test status
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mashxall-full-fidelity-20261022
          name: Mashxall 3.1.3 — Original-app full-fidelity build
          prerelease: true
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/Mashxall-3.1.3.apk
          body: |
            Standalone APK rebuilt from the exact original split bundle uploaded by the repository owner, with original application class namespace, all original activities/services/receivers/providers, original resources, offline database, and ARM64 native libraries preserved.
            The original smali is reassembled after changing only the compiled application-ID literal and package-specific notification-audio resource URIs needed by the separate package ID.
            Static validation checks APK signature/alignment, all DEX files and class descriptors, manifest identity, original database checksum, launcher resources, and four original ARM64 native libraries.
            The Android 11 ARM64 emulator job installed and launched the rebuilt APK and confirmed the process remained alive. See workflow logs and diagnostics artifact for the exact runtime result.
            Package ID: com.kosratdahmad.mashxall.full. Some Firebase/Maps/remote services may enforce the publisher's original package/signing identity.
            The signer is a temporary test key unless a stable repository signing secret is configured.
        env:
          GITHUB_TOKEN: ${{ github.token }}
