name: Runtime smoke test for unified Mashxall

on:
  workflow_run:
    workflows:
      - Build the new unified Mashxall Android app
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  android-11-runtime-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the current runtime test harness
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the APK from that exact successful build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mashxall-build-artifact" dist/runtime-test
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/mashxall-build-artifact"
          APK="$(find "$RUNNER_TEMP/mashxall-build-artifact" -type f -name 'Mashxall-Unified-debug.apk' -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "No non-empty unified Mashxall APK was found in the successful build artifact."
            find "$RUNNER_TEMP/mashxall-build-artifact" -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Downloaded APK size: $(stat -c '%s' "$APK") bytes"
          sha256sum "$APK" | tee dist/runtime-test/apk-sha256.txt

      - name: Prepare Android 11 emulator image
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-30;default;x86_64"

      - name: Install and launch the data-enabled app in Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-wait-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -memory 2048 -cores 2
          script: bash tools/runtime-smoke-android11.sh
      - name: Upload emulator runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-android11-runtime-smoke-${{ github.event.workflow_run.run_number }}
          path: dist/runtime-test/
          if-no-files-found: warn
          retention-days: 14
