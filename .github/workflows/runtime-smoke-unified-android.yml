name: Runtime smoke test for unified Mashxall

on:
  workflow_run:
    workflows:
      - Build the new unified Mashxall Android app
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  android-11-runtime-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact source commit that was built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the APK from that exact successful build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mashxall-build-artifact" dist/runtime-test
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/mashxall-build-artifact"
          APK="$(find "$RUNNER_TEMP/mashxall-build-artifact" -type f -name 'Mashxall-Unified-debug.apk' -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "No non-empty unified Mashxall APK was found in the successful build artifact."
            find "$RUNNER_TEMP/mashxall-build-artifact" -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Downloaded APK size: $(stat -c '%s' "$APK") bytes"
          sha256sum "$APK" | tee dist/runtime-test/apk-sha256.txt

      - name: Prepare Android 11 emulator image
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-30;default;x86_64"

      - name: Install and launch the data-enabled app in Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-wait-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -memory 2048 -cores 2
          script: |
            # android-emulator-runner executes this block with /bin/sh, not Bash.
            set -eu
            adb wait-for-device
            adb logcat -c
            adb install --no-streaming "$APK_PATH" | tee dist/runtime-test/install.txt
            adb shell am force-stop com.mashxall.unified
            adb shell am start -n com.mashxall.unified/.MainActivity --es com.mashxall.unified.OPEN_SCREEN prayer | tee dist/runtime-test/launch.txt

            # Exercise data-backed screens, not just the launcher and the prayer UI.
            # Every entry starts the same installed APK directly at the requested route.
            check_screen() {
              route="$1"
              expected_title="$2"
              file="dist/runtime-test/window-${route}.xml"
              echo "=== Runtime screen smoke: ${route} ==="
              adb shell am force-stop com.mashxall.unified
              adb shell am start -n com.mashxall.unified/.MainActivity --es com.mashxall.unified.OPEN_SCREEN "$route" | tee "dist/runtime-test/launch-${route}.txt"
              sleep 12
              pid="$(adb shell pidof com.mashxall.unified | tr -d '\r')"
              if [ -z "$pid" ]; then
                echo "FAIL: app process died while opening route: $route"
                adb logcat -d -v threadtime > dist/runtime-test/logcat.txt || true
                exit 1
              fi
              adb shell uiautomator dump /sdcard/mashxall-window.xml > "dist/runtime-test/uiautomator-${route}.txt"
              adb pull /sdcard/mashxall-window.xml "$file" >/dev/null
              if ! grep -Eq "$expected_title" "$file"; then
                echo "FAIL: expected title not visible for route: $route"
                cat "$file"
                adb logcat -d -v threadtime > dist/runtime-test/logcat.txt || true
                exit 1
              fi
              echo "PASS: route $route remained active; title matched."
            }

            # Prayer is the first data-intensive screen; the remaining tests verify the
            # most important independent libraries also open and render on Android 11.
            check_screen prayer 'کاتەکانی بانگ|Prayer times|مواقيت الصلاة'
            if ! grep -Eq 'بەیانی|الفجر|Fajr' dist/runtime-test/window-prayer.xml; then
              echo "FAIL: Fajr label is missing from the rendered prayer screen."
              cat dist/runtime-test/window-prayer.xml
              exit 1
            fi
            check_screen quran 'قورئانی پیرۆز|القرآن الكريم|The Holy Quran'
            if ! grep -Eq 'بِسْم|بسم|ٱلْحَمْد|الحمد' dist/runtime-test/window-quran.xml; then
              echo "FAIL: expected Quran verse text is missing from the rendered Quran screen."
              cat dist/runtime-test/window-quran.xml
              exit 1
            fi
            check_screen hadith 'فەرموودەکان|الأحاديث|Hadith'
            if ! grep -Eq '8202|٨٬٢٠٢|٨٢٠٢' dist/runtime-test/window-hadith.xml; then
              echo "FAIL: expected source Hadith count was not visible."
              cat dist/runtime-test/window-hadith.xml
              exit 1
            fi
            check_screen books 'کتێبخانە|المكتبة|Book library'
            if ! grep -q '94' dist/runtime-test/window-books.xml; then
              echo "FAIL: expected 94-record source book catalogue was not visible."
              cat dist/runtime-test/window-books.xml
              exit 1
            fi
            check_screen word_by_word 'شیکردنەوەی وشە بە وشە|تفسير كلمة بكلمة|Word-by-word analysis'
            check_screen farmuda 'فەرموودە و دوعاکان|المأثورات والأدعية|Supplications & sayings'
            check_screen tafsir 'تەفسیرو وەرگێڕان|التفسير والترجمة|Tafsir & translation'
            check_screen azkar 'زیکر و دوعاکان|الأذكار والأدعية|Adhkar & duas'
            check_screen names 'ناوە پیرۆزەکان|أسماء الله الحسنى|Names of Allah'
            check_screen tasbih 'تەسبیح|المسبحة|Digital tasbih'
            check_screen audio 'دەنگ و تلاوەت|التلاوات والصوتيات|Recitations & audio'
            check_screen lexicon 'فەرهەنگی وشەکان|معجم الكلمات|Word lexicon'
            check_screen qibla 'ئاڕاستەی قیبلە|اتجاه القبلة|Qibla direction'
            check_screen bookmarks 'نیشانکراوەکان|العلامات المرجعية|Bookmarks'
            check_screen backup 'پاشەکەوتکردن و گەڕاندنەوە|النسخ الاحتياطي والاستعادة|Backup & restore'

            adb logcat -d -v threadtime > dist/runtime-test/logcat.txt
            if grep -E 'FATAL EXCEPTION|NoClassDefFoundError|UnsatisfiedLinkError|Fatal signal' dist/runtime-test/logcat.txt; then
              echo "FAIL: Android reported a fatal runtime error while exercising the screens."
              exit 1
            fi

            cat > dist/runtime-test/RESULT.txt <<'EOF'
            PASS
            APK installed on Android 11 (API 30).
            Prayer, Quran, Hadith, 94-book catalogue, word-analysis, and Farmuda screens were opened directly.
            UI automation verified the prayer-time title and Fajr label, Quran text, hadith-count display, and catalogue count.
            No fatal process exception was found in the captured logcat.
            This CI emulator run does not replace checking GPS sensors, compass accuracy, adhan playback, and local alarm permissions on the user's realme phone.
            EOF
            cat dist/runtime-test/RESULT.txt

      - name: Upload emulator runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashxall-android11-runtime-smoke-${{ github.event.workflow_run.run_number }}
          path: dist/runtime-test/
          if-no-files-found: warn
          retention-days: 14
